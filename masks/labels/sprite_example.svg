<?xml version="1.0" encoding="UTF-8"?>
<!--
    Sprite de labels (Fase 5): modelo pronto para uso com <symbol> + <use>.

    Este arquivo NAO e carregado pelo index.html atual (as Fases 1 e 2 usam
    variaveis CSS label-* ). Ele e um MODELO para a Fase 5 (sprite packs externos).

    Como usar (quando a Fase 5 for implementada, ou para teste manual):

    1. Mantenha este arquivo em masks/labels/sprite.svg (ou troque o nome).
    2. No index.html, dentro de cada botao, adicione:
         <svg class="btn-icon" viewBox="0 0 32 32" aria-hidden="true">
             <use href="masks/labels/sprite.svg#icon-a" />
         </svg>
    3. Adicione no CSS:
         .btn-icon {
             position: absolute;
             top: 50%; left: 50%;
             width: 70%; height: 70%;
             transform: translate(-50%, -50%);
             fill: var(button-color, var(accent));
             pointer-events: none;
             z-index: 5;
         }

    Principios:
    - Cada <symbol> tem viewBox 0 0 32 32 (padrao do projeto).
    - Use fill="currentColor" / stroke="currentColor" em todo elemento pintado.
    - O fill/stroke e controlado pelo CSS do overlay (cor do botao).
    - IDs seguem o padrao icon-<id-do-botao>: icon-a, icon-b, icon-x, icon-y,
      icon-lb, icon-rb, icon-lt, icon-rt, icon-ls, icon-rs, icon-view, icon-menu.

    Para preview: descomente o bloco <svg width=...> no fim do arquivo e
    abra este .svg no navegador. Recomente antes de publicar.

    Licenca: dominio publico (The Unlicense, veja ../LICENSE).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none">

    <!-- ===================== ABXY (Xbox default) ===================== -->

    <symbol id="icon-a" viewBox="0 0 32 32">
        <text x="16" y="22" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="20" font-weight="700"
              fill="currentColor">A</text>
    </symbol>

    <symbol id="icon-b" viewBox="0 0 32 32">
        <text x="16" y="22" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="20" font-weight="700"
              fill="currentColor">B</text>
    </symbol>

    <symbol id="icon-x" viewBox="0 0 32 32">
        <text x="16" y="22" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="20" font-weight="700"
              fill="currentColor">X</text>
    </symbol>

    <symbol id="icon-y" viewBox="0 0 32 32">
        <text x="16" y="22" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="20" font-weight="700"
              fill="currentColor">Y</text>
    </symbol>

    <!-- ===================== Shoulder buttons ===================== -->

    <symbol id="icon-lb" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="14" font-weight="700"
              fill="currentColor">LB</text>
    </symbol>

    <symbol id="icon-rb" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="14" font-weight="700"
              fill="currentColor">RB</text>
    </symbol>

    <symbol id="icon-lt" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="14" font-weight="700"
              fill="currentColor">LT</text>
    </symbol>

    <symbol id="icon-rt" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="14" font-weight="700"
              fill="currentColor">RT</text>
    </symbol>

    <!-- ===================== Analog sticks (normalmente vazios) ===================== -->

    <symbol id="icon-ls" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="12" font-weight="700"
              fill="currentColor">LS</text>
    </symbol>

    <symbol id="icon-rs" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle"
              font-family="'Inter', 'Segoe UI', sans-serif"
              font-size="12" font-weight="700"
              fill="currentColor">RS</text>
    </symbol>

    <!-- ===================== System buttons (View / Menu) ===================== -->

    <!-- View: dois retangulos sobrepostos (estilo Xbox) -->
    <symbol id="icon-view" viewBox="0 0 32 32">
        <rect x="6"  y="9"  width="14" height="11"
              stroke="currentColor" stroke-width="1.8" fill="none" rx="1" />
        <rect x="12" y="13" width="14" height="11"
              stroke="currentColor" stroke-width="1.8" fill="none" rx="1" />
    </symbol>

    <!-- Menu: hamburger (tres linhas horizontais) -->
    <symbol id="icon-menu" viewBox="0 0 32 32">
        <path d="M6 10 H26 M6 16 H26 M6 22 H26"
              stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" fill="none" />
    </symbol>

    <!--
        ================================================================
        Alternativas PlayStation (para referencia).
        Para ativar: remova os simbolos Xbox acima e descomente o bloco abaixo.
        ================================================================

    <symbol id="icon-a" viewBox="0 0 32 32">
        <path d="M9 9 L23 23 M23 9 L9 23"
              stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" />
    </symbol>

    <symbol id="icon-b" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="9"
                stroke="currentColor" stroke-width="3" fill="none" />
    </symbol>

    <symbol id="icon-x" viewBox="0 0 32 32">
        <rect x="7" y="7" width="18" height="18"
              stroke="currentColor" stroke-width="3" fill="none" />
    </symbol>

    <symbol id="icon-y" viewBox="0 0 32 32">
        <path d="M16 7 L27 24 L5 24 Z"
              stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round" />
    </symbol>

    <symbol id="icon-lb" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle" font-family="sans-serif"
              font-size="14" font-weight="700" fill="currentColor">L1</text>
    </symbol>

    <symbol id="icon-rb" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle" font-family="sans-serif"
              font-size="14" font-weight="700" fill="currentColor">R1</text>
    </symbol>

    <symbol id="icon-lt" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle" font-family="sans-serif"
              font-size="14" font-weight="700" fill="currentColor">L2</text>
    </symbol>

    <symbol id="icon-rt" viewBox="0 0 32 32">
        <text x="16" y="21" text-anchor="middle" font-family="sans-serif"
              font-size="14" font-weight="700" fill="currentColor">R2</text>
    </symbol>

    ================================================================
    -->

    <!--
        ================================================================
        Preview (descomente para inspecao visual no navegador).
        Abra este arquivo no browser para ver todos os icones lado a lado.
        Recomente antes de publicar.

    <svg x="0" y="0" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-a" /></svg>
    <svg x="100" y="0" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-b" /></svg>
    <svg x="200" y="0" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-x" /></svg>
    <svg x="300" y="0" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-y" /></svg>
    <svg x="0" y="100" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-lb" /></svg>
    <svg x="100" y="100" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-rb" /></svg>
    <svg x="200" y="100" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-lt" /></svg>
    <svg x="300" y="100" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-rt" /></svg>
    <svg x="0" y="200" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-view" /></svg>
    <svg x="100" y="200" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-menu" /></svg>
    <svg x="200" y="200" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-ls" /></svg>
    <svg x="300" y="200" width="100" height="100" viewBox="0 0 32 32"><use href="#icon-rs" /></svg>

    ================================================================
    -->

</svg>
