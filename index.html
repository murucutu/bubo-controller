<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubo Controller</title>
    <style>
        :root {
            --overlay-width: 768px;
            --overlay-height: 324px;
            --scale: 1;
            --accent: #FFFFFF;
            --color-bg: #000000;
            --color-a: var(--accent);
            --color-b: var(--accent);
            --color-x: var(--accent);
            --color-y: var(--accent);
            --trail-color-1: var(--accent);
            --trail-color-2: var(--accent);
            --trail-color-3: var(--accent);
            --trail-color-4: var(--accent);
            --color-lb: var(--accent);
            --color-rb: var(--accent);
            --color-lt: var(--accent);
            --color-rt: var(--accent);
            --color-ls: var(--accent);
            --color-rs: var(--accent);
            --color-stick: var(--accent);
            --color-dpad: var(--accent);
            --color-view: var(--accent);
            --color-menu: var(--accent);
            --color-l3: var(--accent);
            --color-r3: var(--accent);
            --bg-opacity: 0.5;
            --button-fill-opacity: 0.5;
            --button-pressed-opacity: 1;
            --knob-fill-opacity: 0.4;
            --knob-pressed-opacity: 1;
            --label-font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            --label-size: 22px;
            --label-size-small: 16px;
            --label-weight: 700;
            --label-a: "A"; --label-b: "B"; --label-x: "X"; --label-y: "Y";
            --label-lb: "LB"; --label-rb: "RB";
            --label-lt: "LT"; --label-rt: "RT";
            --label-l3: "L3"; --label-r3: "R3";
            --label-view: ""; --label-menu: "";
            --trigger-pressure: 0%;
            --stick-trail-length: 30;
            --stick-trail-fade: 0.04;
            --stick-trail-blur: 12px;
            --stick-trail-radius: 12;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: transparent;
            font-family: var(--label-font);
        }
        body {
            position: relative; display: flex;
            align-items: center; justify-content: center;
        }
        .controller-overlay {
            position: relative;
            width: var(--overlay-width); height: var(--overlay-height);
            overflow: hidden; opacity: 0.85;
            transform: scale(var(--scale));
            transform-origin: center center;
        }
        .controller-svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%; overflow: visible;
        }

        /* ═══ BACKGROUND RECT ═══ */
        .controller-svg > g > rect {
            fill: var(--color-bg);
            fill-opacity: var(--bg-opacity);
        }

        /* ═══ BUTTON STYLE ═══
           Each button <g> has 2 path/circle children:
             :nth-child(1) = OUTER (fill = black 40%, white 100% pressed)
             :nth-child(2) = INNER (outline = white/colored, always 100%)
           We use :nth-child(1) and :nth-child(2) instead of :first-child
           and :last-child because addLabels() appends <text> as :nth-child(3),
           which would steal :last-child from the outline path. */

        /* nth-child(1) = button fill.
           fill-rule: nonzero converts ring paths (arcade) to solid discs.
           Xbox uses <circle> which is already solid — nonzero is a no-op. */
        .controller-svg g[id] > :nth-child(1) {
            fill: var(--color-bg) !important;
            fill-opacity: var(--button-fill-opacity);
            fill-rule: nonzero !important;
            transition: fill-opacity 0.08s ease-out;
        }
        /* nth-child(2) = button outline */
        .controller-svg g[id] > :nth-child(2) {
            fill: var(--button-color, var(--accent)) !important;
            fill-opacity: 1;
            transition: fill 0.08s ease-out;
        }
        /* Per-button outline color. */
        .controller-svg g#a { --button-color: var(--color-a); }
        .controller-svg g#b { --button-color: var(--color-b); }
        .controller-svg g#x { --button-color: var(--color-x); }
        .controller-svg g#y { --button-color: var(--color-y); }
        .controller-svg g#lb { --button-color: var(--color-lb); }
        .controller-svg g#rb { --button-color: var(--color-rb); }
        .controller-svg g#lt { --button-color: var(--color-lt); }
        .controller-svg g#rt { --button-color: var(--color-rt); }
        .controller-svg g#up, .controller-svg g#down,
        .controller-svg g#left, .controller-svg g#right { --button-color: var(--color-dpad); }
        .controller-svg g#view { --button-color: var(--color-view); }
        .controller-svg g#menu { --button-color: var(--color-menu); }
        .controller-svg g#l3 { --button-color: var(--color-l3); }
        .controller-svg g#r3 { --button-color: var(--color-r3); }

        /* Pressed: fill becomes outline color at 100%. */
        .controller-svg g[id].pressed > :nth-child(1) {
            fill: var(--button-color, var(--accent)) !important;
            fill-opacity: var(--button-pressed-opacity) !important;
        }

        /* ═══ LT/RT (Xbox only) — NO fill, only wave effect ═══ */
        .controller-overlay.controller-xbox .controller-svg g#lt > :nth-child(1),
        .controller-overlay.controller-xbox .controller-svg g#rt > :nth-child(1) {
            fill: none !important;
            fill-opacity: 0 !important;
        }
        .controller-overlay.controller-xbox .controller-svg g#lt.pressed > :nth-child(1),
        .controller-overlay.controller-xbox .controller-svg g#rt.pressed > :nth-child(1) {
            fill: none !important;
            fill-opacity: 0 !important;
        }

        /* ═══ KNOBS ═══
           Xbox knobs: white 40%, 100% on L3/R3.
           Arcade knob: white 100% always. */
        .controller-svg g#left_joy > :nth-child(1),
        .controller-svg g#right_joy > :nth-child(1) {
            fill: var(--accent) !important;
            fill-opacity: var(--knob-fill-opacity);
            transition: fill-opacity 0.08s ease-out;
        }
        .controller-svg g#left_joy > :nth-child(2),
        .controller-svg g#right_joy > :nth-child(2) {
            fill: var(--accent) !important;
            fill-opacity: 1;
        }
        .controller-svg g#left_joy.pressed > :nth-child(1),
        .controller-svg g#right_joy.pressed > :nth-child(1) {
            fill: var(--accent) !important;
            fill-opacity: var(--knob-pressed-opacity) !important;
        }
        .controller-svg g#joy > :nth-child(1),
        .controller-svg g#joy > :nth-child(2) {
            fill: var(--accent) !important;
            fill-opacity: 1;
        }

        /* ═══ BOUNDARIES — outline only (white), no fill ═══ */
        .controller-svg g[id$="_reach"] > :nth-child(1),
        .controller-svg g#joy_reach > :nth-child(1) {
            fill: none !important;
        }
        .controller-svg g[id$="_reach"] > :nth-child(2),
        .controller-svg g#joy_reach > :nth-child(2) {
            fill: var(--accent) !important;
            fill-opacity: 1;
        }

        /* Knob movement transition. */
        .controller-svg g#left_joy,
        .controller-svg g#right_joy,
        .controller-svg g#joy {
            transition: transform 0.05s ease-out;
        }

        /* ═══ LABELS (nth-child(3)+) ═══ */
        .controller-svg g[id] text {
            fill: var(--accent);
            fill-opacity: 0.9;
            font-family: var(--label-font);
            font-weight: var(--label-weight);
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill-opacity 0.08s ease-out;
        }
        .controller-svg g[id].pressed text {
            fill: var(--color-bg);
            fill-opacity: 1;
        }

        /* ═══ TRIGGER OVERLAYS (Xbox LT/RT) ═══ */
        .trigger-overlay {
            position: absolute; overflow: hidden;
            pointer-events: none; z-index: 10;
        }
        .trigger-fill {
            position: absolute; top: 0; bottom: 0;
            width: var(--trigger-pressure); opacity: 0.72;
            transition: width 0.05s linear, opacity 0.05s linear;
        }
        .trigger-overlay.lt .trigger-fill {
            right: 0;
            background: linear-gradient(90deg,
                color-mix(in srgb, var(--color-lt) 88%, transparent),
                color-mix(in srgb, var(--color-lt) 14%, transparent));
        }
        .trigger-overlay.rt .trigger-fill {
            left: 0;
            background: linear-gradient(90deg,
                color-mix(in srgb, var(--color-rt) 14%, transparent),
                color-mix(in srgb, var(--color-rt) 88%, transparent));
        }
        .trigger-overlay.pressed .trigger-fill { opacity: 1; }
        .trigger-graph {
            display: block; position: absolute; inset: 0;
            width: 100%; height: 100%; pointer-events: none;
        }

        /* ═══ STICK TRAIL (Arcade) ═══ */
        .stick-trail-canvas {
            position: absolute; pointer-events: none;
            /* NO z-index — let DOM order decide. Canvas is inserted BEFORE
               the SVG, so the SVG (and its knob) renders ON TOP of the trail.
               The SVG has position:absolute which establishes its own
               stacking context, painting it above the canvas. */
        }

        /* ═══ DEBUG ═══ */
        .controller-overlay.debug .controller-svg g[id] > :nth-child(2) {
            stroke: #ff00ff; stroke-width: 1;
        }
    </style>
</head>

    <script>
        (() => {

            const OVERLAY_BASE_WIDTH = 768;
            const OVERLAY_BASE_HEIGHT = 324;

                try {
                    const params = new URLSearchParams(window.location.search);
                    return (params.get(name) || fallback).toLowerCase();
                } catch (e) { return fallback; }
            }
            function getScaleOverride() {
                try {
                    const raw = new URLSearchParams(window.location.search).get('scale');

                const set = ICON_SETS[getParam('icons', 'xbox')];
                if (!set) return;
                const root = document.documentElement;
                for (const [k, v] of Object.entries(set)) root.style.setProperty(k, v);
            }
            applyIconSet();

            const BUTTON_MAP = Object.freeze({
                a:0,b:1,x:2,y:3,lb:4,rb:5,lt:6,rt:7,
                view:8,menu:9,l3:10,r3:11,
                up:12,down:13,left:14,right:15
            });
            const TRIGGER_BUTTONS = Object.freeze({ lt:6, rt:7 });
            const DPAD_BUTTONS = Object.freeze({ up:12, down:13, left:14, right:15 });
            const ANALOG_DEAD_ZONE = 0.05;
            const clamp = (v, mn=0, mx=1) => Math.min(mx, Math.max(mn, v));
            const clampAxis = (v) => Math.min(1, Math.max(-1, v));

            class BuboController {
                constructor() {
                    this.overlay = document.getElementById('controller-overlay');
                    this.controllerType = getParam('controller', 'xbox');
                    this.svg = null;
                    this.elements = {};
                    this.triggerCanvases = {};
                    this.triggerContexts = {};
                    this.triggerColors = {};
                    this.lastPressure = { lt:0, rt:0 };
                    this.stickCanvas = null;
                    this.stickCtx = null;
                    this.stickTrail = [];
                    this.stickTrailLength = this.readVar('--stick-trail-length', 30);
                    this.stickTrailFade = this.readVar('--stick-trail-fade', 0.04);
                    this.stickTrailBlur = this.readVar('--stick-trail-blur', 12);
                    this.stickTrailRadius = this.readVar('--stick-trail-radius', 12);
                    this.analogNeutral = {};
                    this.analogNeutralCalibrated = false;
                    this.dpadState = { up:false, down:false, left:false, right:false };
                    this.isArcade = false;
                    this.knobElements = [];
                    /* Add controller type class for CSS scoping (LT/RT no-fill = Xbox only). */
                    this.overlay.classList.add('controller-' + this.controllerType);
                    this.loadController();
                    this.bindDebug();
                    this.animate = this.animate.bind(this);
                    this.animate();
                }
                readVar(name, fallback) {
                    const v = getComputedStyle(this.overlay).getPropertyValue(name).trim();
                    const n = Number.parseFloat(v);
                    return Number.isFinite(n) ? n : fallback;
                }
                /* Resolve CSS variable to RGB via probe element.
                   Uses var(varName) so browser resolves the full chain. */
                parseCssVarToRgb(varName) {
                    const probe = document.createElement('div');
                    probe.style.color = `var(${varName})`;
                    document.body.appendChild(probe);
                    const computed = getComputedStyle(probe).color;
                    document.body.removeChild(probe);
                    const m = computed.match(/\d+/g);
                    if (!m || m.length < 3) return { r:255, g:255, b:255 };
                    return { r:parseInt(m[0],10), g:parseInt(m[1],10), b:parseInt(m[2],10) };
                }
                parseColorToRgb(color) {
                    const fb = { r:255, g:255, b:255 };
                    if (!color) return fb;
                    const probe = document.createElement('div');
                    probe.style.color = color;
                    document.body.appendChild(probe);
                    const computed = getComputedStyle(probe).color;
                    document.body.removeChild(probe);
                    const m = computed.match(/\d+/g);
                    if (!m || m.length < 3) return fb;
                    return { r:parseInt(m[0],10), g:parseInt(m[1],10), b:parseInt(m[2],10) };
                }
                loadController() {
                    const templateId = CONTROLLERS[this.controllerType];
                    if (!templateId) return;
                    const template = document.getElementById(templateId);
                    if (!template) return;
                    const clone = template.content.cloneNode(true);
                    this.svg = clone.querySelector('svg');
                    if (!this.svg) return;
                    this.svg.classList.add('controller-svg');
                    this.overlay.appendChild(clone);
                    this.isArcade = this.controllerType === 'arcade';
                    this.processSvg();
                    this.collectElements();
                    this.cacheKnobData();
                    this.addLabels();

                    else this.setupStickTrail();
                }
                processSvg() {
                    /* Remove style from SVG ROOT (contains fill-rule:evenodd
                       which is inherited by all paths). querySelectorAll
                       excludes the element itself, so we do it manually. */
                    this.svg.removeAttribute('style');
                    /* Remove all inline styles and fill attributes from descendants. */
                    this.svg.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
                    this.svg.querySelectorAll('path, circle, rect').forEach(el => {
                        el.removeAttribute('fill');
                    });

                       perfect circle), replace the ring-shaped <path> (2 subpaths:
                       outer + inner concentric circles) with a solid <circle>.
                       This is the most reliable way to ensure the button fill is
                       visible — CEF (OBS) sometimes doesn't render fill-rule:nonzero
                       correctly via CSS or attribute.
                       IMPORTANT: the circular list is DIFFERENT per controller type:
                         - Xbox: only a/b/x/y and the joy knobs are circular.
                           LB/RB/LT/RT are curved rectangles — NOT circular.
                           View/Menu are pill-shaped — NOT circular.
                         - Arcade: ALL main buttons (lb/rb/lt/rt/a/b/x/y/l3/r3) are
                           circular. View/Menu are pill-shaped — NOT circular.
                       Non-circular buttons keep their <path> with fill-rule:nonzero
                       fallback so they don't get deformed into circles. */
                    const CIRCULAR_IDS_XBOX = Object.freeze(new Set([
                        'a', 'b', 'x', 'y',
                        /* Xbox lb/rb/lt/rt are curved rectangles — NOT in this list. */
                        /* Xbox view/menu are pill shapes — NOT in this list. */
                        /* Xbox up/down/left/right are arrows — NOT in this list. */
                    ]));
                    const CIRCULAR_IDS_ARCADE = Object.freeze(new Set([
                        'a', 'b', 'x', 'y',
                        'lb', 'rb', 'lt', 'rt',  /* Arcade lb/rb/lt/rt ARE circles */
                        'l3', 'r3',
                    ]));
                    const circularIds = this.isArcade ? CIRCULAR_IDS_ARCADE : CIRCULAR_IDS_XBOX;
                    this.svg.querySelectorAll('g[id]').forEach(g => {
                        const gid = g.id;
                        const children = Array.from(g.children)
                            .filter(el => el.tagName.toLowerCase() !== 'text');
                        if (children[0] && children[0].tagName.toLowerCase() === 'path'
                            && circularIds.has(gid)) {
                            /* Circular button with ring path → convert to solid circle. */
                            this.replaceRingWithCircle(children[0], g);
                        } else if (children[0] && children[0].tagName.toLowerCase() === 'path') {
                            /* Non-circular button (rect/pill/arrow/reach):
                               extract ONLY the outer subpath to make it solid.
                               This is more reliable than fill-rule:nonzero in CEF. */
                            this.extractOuterSubpath(children[0]);
                        }
                    });
                }
                /* Replace a ring-shaped <path> (2 subpaths forming a donut)
                   with an equivalent <circle> (solid disc). Uses the path's
                   bounding box to derive center and radius. */
                replaceRingWithCircle(pathEl, parentGroup) {
                    try {
                        const bbox = pathEl.getBBox();
                        const cx = bbox.x + bbox.width / 2;
                        const cy = bbox.y + bbox.height / 2;
                        const r = Math.min(bbox.width, bbox.height) / 2;
                        const circle = document.createElementNS(
                            'http://www.w3.org/2000/svg', 'circle');
                        circle.setAttribute('cx', cx);
                        circle.setAttribute('cy', cy);
                        circle.setAttribute('r', r);
                        /* Copy any transform from the path (shouldn't have one,
                           the transform is on the parent <g>, but just in case). */
                        const pathTransform = pathEl.getAttribute('transform');
                        if (pathTransform) circle.setAttribute('transform', pathTransform);
                        /* Replace path with circle in the parent group. */
                        parentGroup.replaceChild(circle, pathEl);
                    } catch (e) {
                        /* If getBBox fails (e.g., not yet rendered), skip.
                           The CSS fill-rule fallback will handle it. */
                    }
                }
                /* For pill-shaped buttons (view/menu), the path is a ring
                   (outer subpath + inner subpath). fill-rule:nonzero doesn't
                   reliably render solid in CEF. Solution: extract ONLY the
                   outer subpath (first M...Z segment) and use it as a solid
                   fill. This works for any ring path, regardless of shape. */
                extractOuterSubpath(pathEl) {
                    try {
                        const d = pathEl.getAttribute('d') || '';
                        /* Split by 'M' (subpath start), keeping the M. */
                        const parts = d.split(/(?=M)/).filter(s => s.trim());
                        if (parts.length >= 2) {
                            /* Use only the first subpath (outer boundary). */
                            pathEl.setAttribute('d', parts[0].trim());
                        }
                    } catch (e) {
                        /* If anything fails, leave the path as-is. */
                    }
                }
                collectElements() {
                    Object.keys(BUTTON_MAP).forEach(id => {
                        const el = this.svg.querySelector('#' + id);
                        if (el) this.elements[id] = el;
                    });
                    /* Also collect non-button elements (joy knob for arcade). */
                    const joy = this.svg.querySelector('#joy');
                    if (joy) this.elements.joy = joy;
                    if (this.isArcade) {
                        this.knobElements = [{ id:'joy', el: this.svg.querySelector('#joy'), reachId: 'joy_reach' }];
                    } else {
                        this.knobElements = [
                            { id:'ls', el: this.svg.querySelector('#left_joy'), stickId:'ls', reachId: 'left_joy_reach' },
                            { id:'rs', el: this.svg.querySelector('#right_joy'), stickId:'rs', reachId: 'right_joy_reach' }
                        ];
                    }
                }
                /* Cache original transform AND calculate max offset per knob
                   based on actual knob/reach BBox sizes. This ensures the knob
                   EDGES touch the reach boundary (not the center exceeding it). */
                cacheKnobData() {
                    this.knobElements.forEach(k => {
                        if (!k.el) return;
                        k.originalTransform = k.el.getAttribute('transform') || '';
                        /* Calculate max offset from knob and reach sizes. */
                        const knobBBox = this.getGroupBBox(k.el);
                        const reach = k.reachId ? this.svg.querySelector('#' + k.reachId) : null;
                        if (reach && knobBBox) {
                            const reachBBox = this.getGroupBBox(reach);
                            /* Max offset = (reach_radius - knob_radius) so edges touch boundary. */
                            k.maxOffset = (reachBBox.width - knobBBox.width) / 2;
                        } else {
                            k.maxOffset = 26; /* fallback */
                        }
                    });
                }
                getGroupCenter(g) {
                    try {
                        const bbox = g.getBBox();
                        const ctm = g.getCTM();
                        const pt = this.svg.createSVGPoint();
                        pt.x = bbox.x + bbox.width / 2;
                        pt.y = bbox.y + bbox.height / 2;
                        const t = pt.matrixTransform(ctm);
                        return { x: t.x, y: t.y };
                    } catch(e) { return null; }
                }
                getGroupBBox(g) {
                    try {
                        const bbox = g.getBBox();
                        const ctm = g.getCTM();
                        const p1 = this.svg.createSVGPoint();
                        p1.x = bbox.x; p1.y = bbox.y;
                        const p2 = this.svg.createSVGPoint();
                        p2.x = bbox.x + bbox.width; p2.y = bbox.y + bbox.height;
                        const t1 = p1.matrixTransform(ctm);
                        const t2 = p2.matrixTransform(ctm);
                        return {
                            x: Math.min(t1.x, t2.x), y: Math.min(t1.y, t2.y),
                            width: Math.abs(t2.x - t1.x), height: Math.abs(t2.y - t1.y)
                        };
                    } catch(e) { return null; }
                }
                addLabels() {
                    const labelMap = {
                        a:'label-a', b:'label-b', x:'label-x', y:'label-y',
                        lb:'label-lb', rb:'label-rb', lt:'label-lt', rt:'label-rt',
                        l3:'label-l3', r3:'label-r3', view:'label-view', menu:'label-menu'
                    };
                    Object.entries(labelMap).forEach(([id, varName]) => {
                        const g = this.elements[id];
                        if (!g) return;
                        const center = this.getGroupCenter(g);
                        if (!center) return;
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', center.x);
                        text.setAttribute('y', center.y);
                        text.setAttribute('font-size',
                            ['lb','rb','lt','rt','l3','r3','view','menu'].includes(id)
                                ? 'var(--label-size-small)' : 'var(--label-size)');
                        const varVal = getComputedStyle(document.documentElement)
                            .getPropertyValue(varName).trim();
                        text.textContent = varVal.replace(/^["']|["']$/g, '');
                        g.appendChild(text);
                    });
                }
                setupTriggerOverlays() {
                    ['lt','rt'].forEach(id => {
                        const g = this.elements[id];
                        if (!g) return;
                        const bbox = this.getGroupBBox(g);
                        if (!bbox) return;
                        const overlay = document.createElement('div');
                        overlay.className = 'trigger-overlay ' + id;
                        overlay.id = 'trigger-' + id;
                        overlay.style.left = bbox.x + 'px';
                        overlay.style.top = bbox.y + 'px';
                        overlay.style.width = bbox.width + 'px';
                        overlay.style.height = bbox.height + 'px';
                        const fill = document.createElement('div');
                        fill.className = 'trigger-fill';
                        overlay.appendChild(fill);
                        const canvas = document.createElement('canvas');
                        canvas.className = 'trigger-graph';
                        canvas.width = Math.round(bbox.width);
                        canvas.height = Math.round(bbox.height);
                        overlay.appendChild(canvas);
                        this.overlay.appendChild(overlay);
                        this.triggerCanvases[id] = canvas;
                        this.triggerContexts[id] = canvas.getContext('2d');
                        const rawColor = getComputedStyle(g).getPropertyValue('--button-color').trim();
                        this.triggerColors[id] = this.parseColorToRgb(rawColor);
                    });
                }
                setupStickTrail() {
                    const joy = this.elements.joy;
                    if (!joy) return;
                    const reach = this.svg.querySelector('#joy_reach');
                    if (!reach) return;
                    const bbox = this.getGroupBBox(reach);
                    if (!bbox) return;
                    const padding = 20;
                    const canvas = document.createElement('canvas');
                    canvas.className = 'stick-trail-canvas';
                    canvas.width = Math.round(bbox.width + padding * 2);
                    canvas.height = Math.round(bbox.height + padding * 2);
                    canvas.style.left = (bbox.x - padding) + 'px';
                    canvas.style.top = (bbox.y - padding) + 'px';
                    canvas.style.width = (bbox.width + padding * 2) + 'px';
                    canvas.style.height = (bbox.height + padding * 2) + 'px';
                    /* Insert canvas BEFORE the SVG so the knob renders ON TOP
                       of the trail. The trail is visible through the 40%
                       transparent background rect. */
                    this.overlay.insertBefore(canvas, this.svg);
                    this.stickCanvas = canvas;
                    this.stickCtx = canvas.getContext('2d');
                    /* Resolve trail colors via CSS var() probe. */
                    this.trailColors = [
                        this.parseCssVarToRgb('--trail-color-1'),
                        this.parseCssVarToRgb('--trail-color-2'),
                        this.parseCssVarToRgb('--trail-color-3'),
                        this.parseCssVarToRgb('--trail-color-4')
                    ];
                    this.stickCanvasCenter = { x: canvas.width / 2, y: canvas.height / 2 };
                }
                bindDebug() {
                    this.overlay?.addEventListener('dblclick', () => {
                        this.overlay?.classList.toggle('debug');
                    });
                }
                getGamepad() {
                    const gp = navigator.getGamepads?.bind(navigator);
                    if (typeof gp !== 'function') return null;
                    return Array.from(gp() || []).find(g => g && g.buttons.length > 0) || null;
                }
                getTriggerPressure(button) {
                    if (!button || typeof button.value !== 'number' || !Number.isFinite(button.value))
                        return button?.pressed ? 1 : 0;
                    const v = clamp(button.value);
                    return v > 0 ? v : (button.pressed ? 1 : 0);
                }
                setButtonState(id, pressed) {
                    this.elements[id]?.classList.toggle('pressed', Boolean(pressed));
                }
                setTriggerPressure(id, pressure) {
                    const el = this.elements[id];
                    if (!el) return;
                    const p = clamp(Number(pressure) || 0);
                    this.lastPressure[id] = p;
                    const overlay = document.getElementById('trigger-' + id);
                    if (overlay) {
                        overlay.style.setProperty('--trigger-pressure', (p * 100) + '%');
                        overlay.classList.toggle('pressed', p > 0.05);
                    }
                    el.classList.toggle('pressed', p > 0.05);
                }
                normalizeAxis(value, neutral = 0) {
                    const raw = Number(value);
                    if (!Number.isFinite(raw)) return 0;
                    const adj = clampAxis(raw - neutral);
                    return Math.abs(adj) < ANALOG_DEAD_ZONE ? 0 : adj;
                }
                resetSticks() {
                    this.knobElements.forEach((k) => {
                        if (k.el && k.originalTransform !== undefined) {
                            k.el.setAttribute('transform', k.originalTransform);
                        }
                    });
                    this.stickTrail = [];
                }
                calibrateNeutral(gamepad) {
                    if (this.analogNeutralCalibrated || !gamepad || gamepad.axes.length < 2) return;
                    if (this.isArcade) {
                        if (Math.abs(gamepad.axes[0]) < 0.20 && Math.abs(gamepad.axes[1]) < 0.20) {
                            this.analogNeutral = { x: gamepad.axes[0], y: gamepad.axes[1] };
                            this.analogNeutralCalibrated = true;
                        }
                    } else {
                        if (gamepad.axes.length >= 4 &&
                            Math.abs(gamepad.axes[0]) < 0.20 && Math.abs(gamepad.axes[1]) < 0.20 &&
                            Math.abs(gamepad.axes[2]) < 0.20 && Math.abs(gamepad.axes[3]) < 0.20) {
                            this.analogNeutral = {
                                ls: { x: gamepad.axes[0], y: gamepad.axes[1] },
                                rs: { x: gamepad.axes[2], y: gamepad.axes[3] }
                            };
                            this.analogNeutralCalibrated = true;
                        }
                    }
                }
                computeArcadeStick(gamepad) {
                    if (!gamepad) return { x:0, y:0 };
                    const ax = this.normalizeAxis(gamepad.axes[0], this.analogNeutral.x || 0);
                    const ay = this.normalizeAxis(gamepad.axes[1], this.analogNeutral.y || 0);
                    const dx = (this.dpadState.right?1:0) - (this.dpadState.left?1:0);
                    const dy = (this.dpadState.down?1:0) - (this.dpadState.up?1:0);
                    return { x: dx !== 0 ? dx : ax, y: dy !== 0 ? dy : ay };
                }
                /* Move knob with CIRCULAR CLAMP.
                   Magnitude is clamped to 1.0 so diagonal inputs (e.g., D-pad up+right
                   = vector (1,-1) with magnitude sqrt(2) ≈ 1.414) don't exceed the
                   circular reach boundary. The knob EDGES touch the boundary, not
                   the center. */
                updateKnob(id, x, y) {
                    const knob = this.knobElements.find(k => k.id === id || k.stickId === id);
                    if (!knob?.el || knob.originalTransform === undefined) return;
                    /* Circular clamp: magnitude ≤ 1 */
                    const mag = Math.sqrt(x*x + y*y);
                    let cx = x, cy = y;
                    if (mag > 1) { cx = x / mag; cy = y / mag; }
                    const maxOffset = knob.maxOffset || 26;
                    const ox = cx * maxOffset;
                    const oy = cy * maxOffset;
                    knob.el.setAttribute('transform',
                        `translate(${ox} ${oy}) ${knob.originalTransform}`);
                }
                updateArcadeStick(x, y) {
                    this.updateKnob('joy', x, y);
                    if (this.stickCanvas) {
                        /* Record trail position using the arcade knob's max offset. */
                        const arcadeKnob = this.knobElements.find(k => k.id === 'joy');
                        const maxOff = arcadeKnob?.maxOffset || 72;
                        /* Apply same circular clamp for trail position. */
                        const mag = Math.sqrt(x*x + y*y);
                        let cx = x, cy = y;
                        if (mag > 1) { cx = x / mag; cy = y / mag; }
                        const tcx = this.stickCanvasCenter.x + (cx * maxOff);
                        const tcy = this.stickCanvasCenter.y + (cy * maxOff);
                        this.stickTrail.push({ x: tcx, y: tcy });
                        while (this.stickTrail.length > this.stickTrailLength)
                            this.stickTrail.shift();
                    }
                }
                /* Stick trail with ABXY color gradient. */
                drawStickTrail() {
                    if (!this.stickCtx || this.stickTrail.length === 0) return;
                    const ctx = this.stickCtx;
                    const w = this.stickCanvas.width, h = this.stickCanvas.height;
                    ctx.clearRect(0, 0, w, h);
                    const len = this.stickTrail.length;
                    const radius = this.stickTrailRadius;
                    const colors = this.trailColors || [
                        {r:255,g:255,b:255}, {r:255,g:255,b:255},
                        {r:255,g:255,b:255}, {r:255,g:255,b:255}
                    ];
                    /* Motion blur: draw thick line segments between consecutive
                       trail positions, with per-segment color from the gradient.
                       This eliminates gaps when the stick moves fast. */
                    if (len > 1) {
                        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                        ctx.lineWidth = radius * 2;
                        for (let i = 0; i < len - 1; i++) {
                            const p1 = this.stickTrail[i];
                            const p2 = this.stickTrail[i + 1];
                            const progress = (i + 1) / len;
                            const segment = Math.floor((1 - progress) * 4);
                            const colorIdx = Math.min(3, Math.max(0, segment));
                            const c = colors[colorIdx];
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},1)`;
                            if (i < len - 3) {
                                ctx.shadowBlur = this.stickTrailBlur * (1 - progress);

                            } else ctx.shadowBlur = 0;

                        }
                        ctx.shadowBlur = 0;
                    }

                       100% opaque. Ghost glow on older positions via shadowBlur. */
                    for (let i = 0; i < len; i++) {
                        const pos = this.stickTrail[i];
                        const progress = (i + 1) / len;
                        const alpha = 1;
                        const segment = Math.floor((1 - progress) * 4);
                        const colorIdx = Math.min(3, Math.max(0, segment));
                        const c = colors[colorIdx];
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
                        if (i < len - 3) {
                            ctx.shadowBlur = this.stickTrailBlur * (1 - progress);
                            ctx.shadowColor = `rgba(${c.r},${c.g},${c.b},${alpha})`;
                        } else ctx.shadowBlur = 0;
                        ctx.fill(); ctx.shadowBlur = 0;
                    }
                }
                drawTriggerGraph(id) {
                    const canvas = this.triggerCanvases[id];
                    const ctx = this.triggerContexts[id];
                    if (!canvas || !ctx) return;
                    const w = canvas.width, h = canvas.height;
                    const pressure = this.lastPressure[id] || 0;
                    const now = performance.now();
                    const samples = 32;
                    const baseAmp = h * 0.08;
                    const prAmp = h * (0.06 + pressure * 0.34);
                    const pulse = 0.70 + pressure * 0.65;
                    const jitter = 0.18 + pressure * 0.82;
                    ctx.clearRect(0, 0, w, h);
                    ctx.save(); ctx.beginPath();
                    for (let s = 0; s <= samples; s++) {
                        const p = s / samples;
                        const x = id === 'lt' ? w * (1 - p) : w * p;
                        const wave = (
                            Math.sin(p * Math.PI * 4 + now * 0.006) * 0.45 +
                            Math.sin(p * Math.PI * 10 - now * 0.004) * 0.22 +
                            Math.sin(p * Math.PI * 18 + now * 0.003) * jitter
                        );
                        const y = (h / 2) + ((baseAmp + prAmp) * wave * pulse);
                        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    const c = this.triggerColors[id] || { r:255, g:255, b:255 };
                    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.22 + pressure * 0.68})`;
                    ctx.lineWidth = Math.max(1, h * (0.018 + pressure * 0.032));
                    ctx.stroke(); ctx.restore();
                }
                updateGamepadState(gamepad) {
                    if (!gamepad) {
                        this.analogNeutralCalibrated = false;
                        this.dpadState = { up:false, down:false, left:false, right:false };
                        this.resetSticks();
                        for (const id of Object.keys(BUTTON_MAP)) this.setButtonState(id, false);

                    }
                    this.dpadState.up = gamepad.buttons[12]?.pressed || false;
                    this.dpadState.down = gamepad.buttons[13]?.pressed || false;
                    this.dpadState.left = gamepad.buttons[14]?.pressed || false;
                    this.dpadState.right = gamepad.buttons[15]?.pressed || false;
                    for (const [id, idx] of Object.entries(BUTTON_MAP)) {
                        const btn = gamepad.buttons[idx];
                        if (!btn) continue;
                        if (Object.prototype.hasOwnProperty.call(TRIGGER_BUTTONS, id)) {
                            if (!this.isArcade)
                                this.setTriggerPressure(id, this.getTriggerPressure(btn));
                            else
                                this.setButtonState(id, btn.pressed || btn.value > 0.1);
                        } else if (Object.prototype.hasOwnProperty.call(DPAD_BUTTONS, id)) {
                            this.setButtonState(id, btn.pressed);
                        } else {
                            this.setButtonState(id, btn.pressed || btn.value > 0.1);
                        }
                    }
                    if (!this.isArcade) {
                        const l3 = gamepad.buttons[10]?.pressed || false;
                        const r3 = gamepad.buttons[11]?.pressed || false;
                        this.elements.left_joy?.classList.toggle('pressed', l3);
                        this.elements.right_joy?.classList.toggle('pressed', r3);
                    }
                }
                updateAnalogState(gamepad) {
                    this.calibrateNeutral(gamepad);
                    if (this.isArcade) {
                        const { x, y } = this.computeArcadeStick(gamepad);
                        this.updateArcadeStick(x, y);
                    } else {
                        if (gamepad && gamepad.axes.length >= 2) {
                            this.updateKnob('ls',
                                this.normalizeAxis(gamepad.axes[0], this.analogNeutral.ls?.x ?? 0),
                                this.normalizeAxis(gamepad.axes[1], this.analogNeutral.ls?.y ?? 0));
                        }
                        if (gamepad && gamepad.axes.length >= 4) {
                            this.updateKnob('rs',
                                this.normalizeAxis(gamepad.axes[2], this.analogNeutral.rs?.x ?? 0),
                                this.normalizeAxis(gamepad.axes[3], this.analogNeutral.rs?.y ?? 0));
                        }
                    }
                }
                update() {
                    const gp = this.getGamepad();
                    this.updateGamepadState(gp);
                    this.updateAnalogState(gp);
                }
                animate() {
                    this.update();
                    if (!this.isArcade) {
                        this.drawTriggerGraph('lt');
                        this.drawTriggerGraph('rt');
                    } else this.drawStickTrail();
                    requestAnimationFrame(() => this.animate());
                }
            }
            document.addEventListener('DOMContentLoaded', () => {
                window.buboController = new BuboController();
            });
        })();
    </script>
</body>
